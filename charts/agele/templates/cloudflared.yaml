{{- $cf := .Values.cloudflared }}
{{- if $cf.enabled }}
# Outbound-only connector for the remotely managed tunnel; hostnames and routes live in terraform/cloudflare.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agele-cloudflared
  labels:
    {{- include "agele.labels" . | nindent 4 }}
    {{- include "agele.selector" "cloudflared" | nindent 4 }}
spec:
  replicas: {{ $cf.replicas }}
  selector:
    matchLabels:
      {{- include "agele.selector" "cloudflared" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agele.selector" "cloudflared" | nindent 8 }}
        app.kubernetes.io/part-of: agele
        app.kubernetes.io/component: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "agele.selector" "cloudflared" | nindent 14 }}
      containers:
        - name: cloudflared
          image: {{ $cf.image }}
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agele-cloudflared
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $cf.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agele-cloudflared
  labels:
    {{- include "agele.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "agele.selector" "cloudflared" | nindent 6 }}
{{- end }}
