{{- $s := .Values.secrets }}
{{- if or $s.keys .Values.cloudflared.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agele-secrets
  labels:
    {{- include "agele.labels" . | nindent 4 }}
  annotations:
    # Synced before the migration Job (wave -1) and the Deployments.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $s.storeName }}
  target:
    name: agele-secrets
    creationPolicy: Owner
  data:
    {{- range $s.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ . }}
    {{- end }}
{{- if .Values.cloudflared.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agele-cloudflared
  labels:
    {{- include "agele.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $s.storeName }}
  target:
    name: agele-cloudflared
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: {{ .Values.cloudflared.tokenKey }}
{{- end }}
{{- end }}
