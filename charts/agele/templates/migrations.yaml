{{- if .Values.migrations.enabled }}
# Runs drizzle migrations from the api image on every sync, after the secrets
# (wave -2) and before the Deployments (wave 0) roll.
apiVersion: batch/v1
kind: Job
metadata:
  name: agele-migrate
  labels:
    {{- include "agele.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agele-migrate
        app.kubernetes.io/part-of: agele
        agele.xyz/postgres-client: "true"
        agele.xyz/redis-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "agele.backendImage" (dict "root" . "target" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrations.command | nindent 12 }}
          envFrom:
            {{- include "agele.backendEnvFrom" . | nindent 12 }}
          env:
            {{- include "agele.backendEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
{{- end }}
