apiVersion: v1
kind: ConfigMap
metadata:
  name: agele-config
  labels:
    {{- include "agele.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{- if ne (toString $v) "" }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agele
  labels:
    {{- include "agele.labels" . | nindent 4 }}
automountServiceAccountToken: false
