# Grafana and Prometheus are reached over Tailscale only (charts/platform-config adminIngress).
grafana:
  service: { type: ClusterIP }
  persistence: { enabled: true, size: 10Gi }
prometheus:
  prometheusSpec:
    retention: 15d
    # Pick up PodMonitors/ServiceMonitors from every namespace, not only this release.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-encrypted
          resources: { requests: { storage: 50Gi } }
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-encrypted
          resources: { requests: { storage: 5Gi } }
