global:
  # Set per environment in environments/<env>/platform/argo-cd.yaml: the tailnet hostname, used for SSO callbacks.
  domain: ""
configs:
  params:
    # TLS terminates at the Tailscale ingress.
    server.insecure: true
  cm:
    admin.enabled: false
    # SSO: add GitHub OIDC under dex.config before go-live (docs/go-live.md).
    exec.enabled: false
    # Report child Application health so the root app waits for each sync wave to be Healthy
    # (Argo CD 1.8+ no longer assesses Application health by default).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  rbac:
    policy.default: role:readonly
server:
  service: { type: ClusterIP }
dex:
  enabled: true
notifications:
  enabled: false
